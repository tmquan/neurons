# SNEMI3D + MICRONS — Phase 2: warm start from snemi3d_microns checkpoint
#
# Fixes applied from Phase 1 plateau analysis:
#   - label_smoothing  0.5  → 0.05  (was capping CE — model could never exceed 75% confidence)
#   - weight_raw       4.0  → 1.0   (reconstruction was dominating gradient budget)
#   - dropout          0.2  → 0.1   (less regularization — model was underfitting)
#   - weight_decay     1e-3 → 3e-4  (softer L2 penalty)
#   - lr / backbone_lr bumped ~1.5× (compensate for reduced regularization)
#   - eta_min          1e-7 → 1e-6  (warmer LR floor so backbone stays trainable late)
#   - warmup_epochs    5    → 3     (shorter warmup since warm-starting)
#   - batch_size       4    → 8     (GPUs were at 31% VRAM — double throughput)
#   - gradient_checkpointing OFF (31% VRAM at bs=4 — plenty of headroom at bs=8, saves ~25% wall time)
#
# Usage:
#  python scripts/train.py --config-name snemi3d_microns_2 \
#    +ckpt_path=outputs/checkpoints/last.ckpt
#
# See doc/CONFIG_REFERENCE.md for full parameter documentation.

defaults:
  - default

experiment_name: snemi3d_microns_phase2
project_name: neurons-combined
output_dir: outputs

data:
  dataset: snemi3d
  data_root: data/SNEMI3D
  batch_size: 4
  num_workers: 8
  persistent_workers: false
  cache_rate: 0.0
  pin_memory: true
  slice_mode: false
  num_samples: 16000
  patch_size: [48, 256, 256]
  find_boundaries: 1.0

  train_volumes:
    - {vol: AC4_inputs, seg: AC4_labels, root: data/SNEMI3D}
    - {vol: minnie65_mip0_1024_x90000_y70000_z19000_volume, seg: minnie65_mip0_1024_x90000_y70000_z19000_v1300_segmentation, root: data/MICRONS}
    - {vol: minnie65_mip0_1024_x154000_y70000_z20000_volume, seg: minnie65_mip0_1024_x154000_y70000_z20000_v1300_segmentation, root: data/MICRONS}
    - {vol: minnie65_mip0_1024_x90000_y120000_z21000_volume, seg: minnie65_mip0_1024_x90000_y120000_z21000_v1300_segmentation, root: data/MICRONS}
    - {vol: minnie65_mip0_1024_x154000_y120000_z22000_volume, seg: minnie65_mip0_1024_x154000_y120000_z22000_v1300_segmentation, root: data/MICRONS}

  val_volumes:
    - {vol: AC3_inputs, seg: AC3_labels, root: data/SNEMI3D}
    - {vol: minnie65_mip0_1024_x122000_y95000_z21000_volume, seg: minnie65_mip0_1024_x122000_y95000_z21000_v1300_segmentation, root: data/MICRONS}

  test_volumes:
    - {vol: AC3_inputs, seg: AC3_labels, root: data/SNEMI3D}
    - {vol: minnie65_mip0_1024_x122000_y95000_z21000_volume, seg: minnie65_mip0_1024_x122000_y95000_z21000_v1300_segmentation, root: data/MICRONS}

model:
  type: cosmostransfer3d
  in_channels: 1
  num_classes: 16
  emb_dim: 16
  feature_size: 64
  variant: "2B"
  dtype: "bf16"
  freeze_vae_encoder: true
  freeze_dit_backbone: false
  freeze_vae_decoder: false
  gradient_checkpointing: false
  dropout: 0.1

callbacks:
  cuda_empty_cache_before_val: true

training:
  max_epochs: 100
  accelerator: auto
  devices: auto
  strategy: ddp
  precision: bf16-mixed
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  limit_val_batches: 100
  num_sanity_val_steps: 2
  log_every_n_steps: 50
  benchmark: true
  compile: false
  training_modes:
    - automatic

optimizer:
  type: adamw
  lr: 2.0e-4
  dit_backbone_lr: 2.0e-4
  weight_decay: 3.0e-4
  scheduler:
    type: cosine_warmup
    warmup_epochs: 3
    T_max: 100
    eta_min: 1.0e-5

loss:
  semantic_mode: softmax
  active_classes: 2
  class_weights: [2.0, 1.0]
  label_smoothing: 0.05
  weight_semantic: 1.0
  weight_ce: 1.0
  weight_iou: 1.0
  weight_dice: 1.0
  weight_instance: 1.0
  weight_pull: 2.0
  weight_push: 2.0
  weight_norm: 0.01
  delta_v: 0.5
  delta_d: 2.5
  weight_edge: 2.0
  weight_bone: 2.0
  weight_geometry: 1.0
  dir_target: centroid
  weight_dir: 1.0
  weight_cov: 2.0
  weight_raw: 1.0
  loss_dir: l1
  loss_cov: l1
  loss_raw: l1
  ignore_index: -100
