# Combined SNEMI3D + MICRONS Configuration
# Trains CosmosTransfer3D on neuron volumes from both datasets simultaneously.
# Each volume entry includes a 'root' key pointing to its data directory.
#
# Usage:
#   python scripts/train.py --config-name snemi3d_microns
#   python scripts/train.py --config-name snemi3d_microns data.batch_size=8
#
# See doc/CONFIG_REFERENCE.md for full parameter documentation.

defaults:
  - default

experiment_name: snemi3d_microns_combined
project_name: neurons-combined
output_dir: outputs

data:
  dataset: snemi3d
  data_root: data/SNEMI3D  # default root for volumes without explicit root
  batch_size: 4
  num_workers: 10           # per-process; 8 GPUs × 10 = 80 total workers
  cache_rate: 0.0           # LazyVolDataset reads on-demand; no caching
  pin_memory: true
  slice_mode: false          # 3D volumetric patches
  num_samples: 16000         # virtual epoch length (random patches per epoch)
  patch_size: [48, 256, 256]
  overcrop_factor: 1.25      # train crops at 1.25× then random zoom-out to patch_size
  find_boundaries: 1.0       # train only: prob of FindBoundariesd per patch (0=off, 1=always)

  # Train: SNEMI3D AC4 + 4 MICRONS train crops
  train_volumes:
    - {vol: AC4_inputs, seg: AC4_labels, root: data/SNEMI3D}
    - {vol: minnie65_mip0_1024_x120000_y90000_z20000_volume, seg: minnie65_mip0_1024_x120000_y90000_z20000_v1300_segmentation, root: data/MICRONS}
    - {vol: minnie65_mip0_1024_x124100_y90000_z20000_volume, seg: minnie65_mip0_1024_x124100_y90000_z20000_v1300_segmentation, root: data/MICRONS}
    - {vol: minnie65_mip0_1024_x120000_y93100_z20000_volume, seg: minnie65_mip0_1024_x120000_y93100_z20000_v1300_segmentation, root: data/MICRONS}
    - {vol: minnie65_mip0_1024_x124100_y93100_z20000_volume, seg: minnie65_mip0_1024_x124100_y93100_z20000_v1300_segmentation, root: data/MICRONS}

  # Val: held-out SNEMI3D AC3 + MICRONS test crop
  val_volumes:
    - {vol: AC3_inputs, seg: AC3_labels, root: data/SNEMI3D}
    - {vol: minnie65_mip0_1024_x122000_y92000_z20000_volume, seg: minnie65_mip0_1024_x122000_y92000_z20000_v1300_segmentation, root: data/MICRONS}

  # Test: same as val
  test_volumes:
    - {vol: AC3_inputs, seg: AC3_labels, root: data/SNEMI3D}
    - {vol: minnie65_mip0_1024_x122000_y92000_z20000_volume, seg: minnie65_mip0_1024_x122000_y92000_z20000_v1300_segmentation, root: data/MICRONS}

model:
  type: cosmostransfer3d
  in_channels: 1
  num_classes: 16
  emb_dim: 16
  feature_size: 64
  variant: "2B"
  dtype: "bf16"
  freeze_vae_encoder: true        # VAE encoder  (true = always frozen; int N = freeze for N epochs)
  freeze_dit_backbone: false      # DiT backbone (true = always frozen; int N = freeze for N epochs then unfreeze)
  freeze_vae_decoder: false       # VAE decoder  (true = always frozen; int N = freeze for N epochs)
  gradient_checkpointing: false
  dropout: 0.1

training:
  max_epochs: 100
  accelerator: auto
  devices: auto
  strategy: ddp
  precision: bf16-mixed
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  limit_val_batches: 100
  num_sanity_val_steps: 2
  log_every_n_steps: 50
  benchmark: true
  compile: false
  training_modes:
    - automatic

optimizer:
  type: adamw
  lr: 2.0e-4
  dit_backbone_lr: 2.0e-5
  weight_decay: 1.0e-3
  scheduler:
    type: cosine_warmup
    warmup_epochs: 5
    T_max: 100
    eta_min: 1.0e-7

loss:
  semantic_mode: softmax  
  active_classes: 2  # only first 2 of 16 semantic channels receive gradient; bump when adding classes
  class_weights: [2.0, 1.0]
  label_smoothing: 0.1
  weight_semantic: 1.0
  weight_ce: 1.0
  weight_iou: 1.0
  weight_dice: 1.0
  weight_instance: 1.0
  weight_pull: 2.0
  weight_push: 2.0
  weight_norm: 0.01
  delta_v: 0.5
  delta_d: 2.5
  weight_edge: 2.0
  weight_bone: 2.0
  weight_geometry: 1.0
  dir_target: centroid
  weight_dir: 1.0
  weight_cov: 2.0
  weight_raw: 2.0
  loss_dir: l1
  loss_cov: l1
  loss_raw: l1
  ignore_index: -100
