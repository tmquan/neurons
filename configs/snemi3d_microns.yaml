# Combined SNEMI3D + MICRONS Configuration
# Trains CosmosTransfer3D on neuron volumes from both datasets simultaneously.
# Each volume entry includes a 'root' key pointing to its data directory.
#
# Usage:
#   python scripts/train.py --config-name snemi3d_microns
#   python scripts/train.py --config-name snemi3d_microns data.batch_size=8
#
# Full resume (optimizer + epoch) after interruption:
#   python scripts/train.py --config-name snemi3d_microns \\
#     training.resume_from_checkpoint=outputs/checkpoints/last.ckpt
#
# See doc/CONFIG_REFERENCE.md for full parameter documentation.

defaults:
  - default

experiment_name: snemi3d_microns
project_name: neurons-combined
output_dir: outputs

data:
  dataset: snemi3d
  data_root: data/SNEMI3D
  batch_size: 8
  num_workers: 12
  persistent_workers: true
  cache_rate: 0.0
  pin_memory: true
  slice_mode: false
  num_samples: 16000
  patch_size: [48, 256, 256]
  find_boundaries: 1.0
  pixel_size: [30, 6, 6]   # z, y, x in nm — matches array dim order
  min_foreground: 0.90

  train_volumes:
    - {vol: AC4_thin_inputs, seg: AC4_thin_labels, root: data/SNEMI3D}
    - {vol: minnie65_mip0_1024x1024x2048_x53000_y67000_z16500_volume, seg: minnie65_mip0_1024x1024x2048_x53000_y67000_z16500_v1300_segmentation, root: data/MICRONS}
    - {vol: minnie65_mip0_1024x1024x2048_x87000_y67000_z17000_volume, seg: minnie65_mip0_1024x1024x2048_x87000_y67000_z17000_v1300_segmentation, root: data/MICRONS}
    - {vol: minnie65_mip0_1024x1024x2048_x122000_y67000_z18000_volume, seg: minnie65_mip0_1024x1024x2048_x122000_y67000_z18000_v1300_segmentation, root: data/MICRONS}
    - {vol: minnie65_mip0_1024x1024x2048_x156000_y67000_z19000_volume, seg: minnie65_mip0_1024x1024x2048_x156000_y67000_z19000_v1300_segmentation, root: data/MICRONS}
    - {vol: minnie65_mip0_1024x1024x2048_x53000_y122000_z21000_volume, seg: minnie65_mip0_1024x1024x2048_x53000_y122000_z21000_v1300_segmentation, root: data/MICRONS}
    - {vol: minnie65_mip0_1024x1024x2048_x87000_y122000_z21500_volume, seg: minnie65_mip0_1024x1024x2048_x87000_y122000_z21500_v1300_segmentation, root: data/MICRONS}
    - {vol: minnie65_mip0_1024x1024x2048_x122000_y122000_z22500_volume, seg: minnie65_mip0_1024x1024x2048_x122000_y122000_z22500_v1300_segmentation, root: data/MICRONS}
    - {vol: minnie65_mip0_1024x1024x2048_x156000_y122000_z23500_volume, seg: minnie65_mip0_1024x1024x2048_x156000_y122000_z23500_v1300_segmentation, root: data/MICRONS}
    - {vol: minnie65_mip0_1024x1024x2048_x190000_y122000_z24500_volume, seg: minnie65_mip0_1024x1024x2048_x190000_y122000_z24500_v1300_segmentation, root: data/MICRONS}

  val_volumes:
    # - {vol: AC3_thin_inputs, seg: AC3_thin_labels, root: data/SNEMI3D}
    - {vol: minnie65_mip0_1024x1024x2048_x70000_y95000_z20000_volume, seg: minnie65_mip0_1024x1024x2048_x70000_y95000_z20000_v1300_segmentation, root: data/MICRONS}
    - {vol: minnie65_mip0_1024x1024x2048_x139000_y95000_z21000_volume, seg: minnie65_mip0_1024x1024x2048_x139000_y95000_z21000_v1300_segmentation, root: data/MICRONS}

  test_volumes:
    # - {vol: AC3_thin_inputs, seg: AC3_thin_labels, root: data/SNEMI3D}
    - {vol: minnie65_mip0_1024x1024x2048_x70000_y95000_z20000_volume, seg: minnie65_mip0_1024x1024x2048_x70000_y95000_z20000_v1300_segmentation, root: data/MICRONS}
    - {vol: minnie65_mip0_1024x1024x2048_x139000_y95000_z21000_volume, seg: minnie65_mip0_1024x1024x2048_x139000_y95000_z21000_v1300_segmentation, root: data/MICRONS}

model:
  type: cosmostransfer3d
  in_channels: 1
  num_classes: 16
  emb_dim: 16
  feature_size: 64
  variant: "2B"
  dtype: "bf16"
  freeze_vae_encoder: true
  freeze_dit_backbone: false
  freeze_vae_decoder: false
  gradient_checkpointing: false
  dropout: 0.2

callbacks:
  cuda_empty_cache_before_val: true
  image_logger:
    max_images: 8

training:
  max_epochs: 100
  accelerator: auto
  devices: auto
  strategy: ddp
  precision: bf16-mixed
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  limit_val_batches: 50
  num_sanity_val_steps: 2
  log_every_n_steps: 50
  benchmark: true
  compile: true
  training_modes:
    - automatic

optimizer: 
  type: adamw
  lr: 2e-4
  dit_backbone_lr: 2e-4
  weight_decay: 3.0e-4
  scheduler:
    type: cosine_warmup
    warmup_epochs: 5
    T_max: 100
    eta_min: 1.0e-5

loss:
  semantic_mode: sigmoid
  active_classes: 1
  class_weights: [0.2]
  label_smoothing: 0.0
  weight_semantic: 1.0
  weight_ce: 3.0
  weight_iou: 0.0
  weight_dice: 3.0
  weight_instance: 1.0
  weight_pull: 1.0
  weight_push: 1.0
  weight_norm: 0.001
  delta_v: 0.5
  delta_d: 1.5
  normalize_embeddings: false
  learned_task_weights: false
  max_hard_pairs: 0
  weight_edge: 10.0
  weight_bone: 10.0
  weight_geometry: 1.0
  dir_target: centroid
  weight_dir: 2.0
  weight_cov: 2.0
  weight_raw: 2.0
  loss_dir: smooth_l1
  loss_cov: smooth_l1
  loss_raw: smooth_l1
  ignore_index: -100
