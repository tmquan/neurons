# Combined SNEMI3D + MICRONS Configuration
# Trains on neuron volumes from both datasets simultaneously.
# Each volume entry includes a 'root' key pointing to its data directory.

defaults:
  - default

experiment_name: snemi3d_microns_combined
project_name: neurons-combined

data:
  dataset: snemi3d
  data_root: data/SNEMI3D  # default root for volumes without explicit root
  batch_size: 4
  num_workers: 8
  cache_rate: 0.0
  slice_mode: false
  num_samples: 16000
  patch_size: [48, 256, 256]

  # Train: SNEMI3D AC4 + 4 MICRONS train crops
  train_volumes:
    - {vol: AC4_inputs, seg: AC4_labels, root: data/SNEMI3D, find_boundaries: 0.0}
    - {vol: minnie65_mip0_1024_x120000_y90000_z20000_volume, seg: minnie65_mip0_1024_x120000_y90000_z20000_v1300_segmentation, root: data/MICRONS, find_boundaries: 0.0}
    - {vol: minnie65_mip0_1024_x124100_y90000_z20000_volume, seg: minnie65_mip0_1024_x124100_y90000_z20000_v1300_segmentation, root: data/MICRONS, find_boundaries: 0.0}
    - {vol: minnie65_mip0_1024_x120000_y93100_z20000_volume, seg: minnie65_mip0_1024_x120000_y93100_z20000_v1300_segmentation, root: data/MICRONS, find_boundaries: 0.0}
    - {vol: minnie65_mip0_1024_x124100_y93100_z20000_volume, seg: minnie65_mip0_1024_x124100_y93100_z20000_v1300_segmentation, root: data/MICRONS, find_boundaries: 0.0}

  # Val: held-out SNEMI3D AC3 + MICRONS test crop
  val_volumes:
    - {vol: AC3_inputs, seg: AC3_labels, root: data/SNEMI3D, find_boundaries: 0.0}
    - {vol: minnie65_mip0_1024_x122000_y92000_z20000_volume, seg: minnie65_mip0_1024_x122000_y92000_z20000_v1300_segmentation, root: data/MICRONS, find_boundaries: 0.0}

  # Test: same as val
  test_volumes:
    - {vol: AC3_inputs, seg: AC3_labels, root: data/SNEMI3D, find_boundaries: 0.0}
    - {vol: minnie65_mip0_1024_x122000_y92000_z20000_volume, seg: minnie65_mip0_1024_x122000_y92000_z20000_v1300_segmentation, root: data/MICRONS, find_boundaries: 0.0}

