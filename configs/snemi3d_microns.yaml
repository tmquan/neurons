# --- cosmostransfer3d ---
model:
  type: cosmostransfer3d
  in_channels: 1
  num_classes: 16
  emb_dim: 16
  feature_size: 64
  variant: "2B"
  dtype: "fp32"
  freeze_vae_encoder: true        # VAE encoder  (true = always frozen; int N = freeze for N epochs)
  freeze_dit_backbone: 10             # DiT backbone (true = always frozen; int N = freeze for N epochs then unfreeze)
  freeze_vae_decoder: false       # VAE decoder  (true = always frozen; int N = freeze for N epochs)
  dropout: 0.0

training:
  max_epochs: 100
  accelerator: auto
  devices: auto
  strategy: ddp
  precision: 32-true
  gradient_clip_val: 1.0
  accumulate_grad_batches: 5
  limit_val_batches: 100
  num_sanity_val_steps: 2
  log_every_n_steps: 50
  benchmark: true
  training_modes:
    - automatic

optimizer:
  type: adamw
  lr: 2.0e-4
  dit_backbone_lr: 2.0e-5
  weight_decay: 1.0e-5
  scheduler:
    type: cosine
    T_max: 100
    eta_min: 1.0e-7

loss:
  semantic_mode: softmax  
  active_classes: 2  # only first 2 of 16 semantic channels receive gradient; bump when adding classes
  weight_semantic: 1.0
  weight_ce: 1.0
  weight_iou: 1.0
  weight_dice: 1.0
  weight_instance: 1.0
  weight_pull: 1.0
  weight_push: 1.0
  weight_norm: 0.001
  delta_v: 0.5
  delta_d: 1.5
  weight_edge: 5.0
  weight_bone: 5.0
  weight_geometry: 0.1
  dir_target: centroid
  weight_dir: 1.0
  weight_cov: 1.0
  weight_raw: 1.0
  loss_dir: l1
  loss_cov: l1
  loss_raw: l1
  ignore_index: -100
