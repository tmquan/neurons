# SNEMI3D 2D Slice Configuration
# Slice-based neuron segmentation (Vista2D)

defaults:
  - default

experiment_name: snemi2d_instance_seg
project_name: neurons-snemi2d

data:
  dataset: snemi3d
  data_root: data/SNEMI3D
  batch_size: 8
  num_workers: 4
  cache_rate: 0.5
  slice_mode: true
  train_volumes:
    - {vol: AC4_inputs, seg: AC4_labels}
  test_volumes:
    - {vol: AC3_inputs, seg: AC3_labels}

model:
  type: vista2d
  in_channels: 1
  num_classes: 16
  emb_dim: 16
  feature_size: 48
  dropout: 0.2

optimizer:
  type: adamw
  lr: 1.0e-4
  weight_decay: 1.0e-5
  scheduler:
    type: cosine
    T_max: 100
    eta_min: 1.0e-6

loss:
  semantic_mode: sigmoid
  weight_semantic: 1.0
  weight_ce: 1.0
  weight_iou: 1.0
  weight_dice: 1.0
  weight_instance: 1.0
  weight_pull: 1.0
  weight_push: 1.0
  weight_norm: 0.001
  delta_v: 0.5
  delta_d: 1.5
  weight_edge: 10.0
  weight_bone: 1.0
  weight_geometry: 1.0
  dir_target: centroid
  weight_dir: 1.0
  weight_cov: 0.0
  weight_raw: 1.0
  loss_dir: smooth_l1
  loss_cov: mse
  loss_raw: l1
  ignore_index: -100

training:
  max_epochs: 100
  accelerator: auto
  devices: auto
  strategy: ddp
  precision: 16-mixed
  gradient_clip_val: 1.0
  limit_val_batches: 20
  log_every_n_steps: 50
  benchmark: true
  training_modes:
    - automatic
