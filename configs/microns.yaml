# MICRONS Configuration
# Large-scale cortical connectomics (minnie65, 8x8x40 nm)
#
# Download: python scripts/download_microns.py --split --seg-version 1300
# Train: 2048^3 at (140000, 100000, 20000)
# Test:  1024^3 at (143000, 103000, 20000)

defaults:
  - default

experiment_name: microns_seg
project_name: neurons-microns

data:
  dataset: microns
  data_root: /scratch/MICRONS
  batch_size: 4
  num_workers: 8
  val_num_workers: 4
  test_num_workers: 4
  cache_rate: 0.0
  slice_mode: false
  num_samples: 4000
  find_boundaries: 0.5
  patch_size: [48, 256, 256]
  train_volumes:
    - {vol: minnie65_mip0_crop_1024_train_volume, seg: minnie65_mip0_crop_1024_train_v1300_segmentation}
  test_volumes:
    - {vol: minnie65_mip0_crop_1024_test_volume, seg: minnie65_mip0_crop_1024_test_v1300_segmentation}

model:
  type: vista3d
  in_channels: 1
  num_classes: 16
  emb_dim: 16
  feature_size: 48
  dropout: 0.2

optimizer:
  type: adamw
  lr: 1.0e-4
  weight_decay: 1.0e-5
  scheduler:
    type: cosine
    T_max: 100
    eta_min: 1.0e-6

loss:
  throughput_mode: true
  semantic_mode: sigmoid
  weight_semantic: 1.0
  weight_ce: 1.0
  weight_iou: 1.0
  weight_dice: 1.0
  weight_instance: 1.0
  weight_pull: 1.0
  weight_push: 1.0
  weight_norm: 0.001
  delta_v: 0.5
  delta_d: 1.5
  weight_edge: 10.0
  weight_bone: 1.0
  weight_geometry: 1.0
  dir_target: centroid
  weight_dir: 1.0
  weight_cov: 0.0
  weight_raw: 1.0
  loss_dir: smooth_l1
  loss_cov: mse
  loss_raw: l1
  ignore_index: -100

training:
  max_epochs: 100
  accelerator: auto
  devices: auto
  strategy: ddp
  precision: 16-mixed
  gradient_clip_val: 1.0
  limit_val_batches: 20
  check_val_every_n_epoch: 2
  log_every_n_steps: 50
  benchmark: true
  training_modes:
    - automatic
