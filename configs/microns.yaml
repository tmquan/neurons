# MICRONS Configuration
# Large-scale cortical connectomics (minnie65, 8x8x40 nm)
#
# Download all splits: python scripts/download_microns.py --split --seg-version 1300
#
# Splits (11 total: 9 train + 2 test, all 1024x1024x2048, disjoint):
#   train01-10: 5-col x 2-row XY grid, Z varies 16500-24500
#   test01-02:  XY gap positions, Z=20000/21000

defaults:
  - default

experiment_name: microns_seg
project_name: neurons-microns

data:
  dataset: microns
  data_root: data/MICRONS
  batch_size: 4
  num_workers: 8
  cache_rate: 0.0
  slice_mode: false
  num_samples: 4000
  find_boundaries: 0.5
  patch_size: [48, 256, 256]
  train_volumes:
    - {vol: minnie65_mip0_1024x1024x2048_x53000_y67000_z16500_volume, seg: minnie65_mip0_1024x1024x2048_x53000_y67000_z16500_v1300_segmentation}
    - {vol: minnie65_mip0_1024x1024x2048_x87000_y67000_z17000_volume, seg: minnie65_mip0_1024x1024x2048_x87000_y67000_z17000_v1300_segmentation}
    - {vol: minnie65_mip0_1024x1024x2048_x122000_y67000_z18000_volume, seg: minnie65_mip0_1024x1024x2048_x122000_y67000_z18000_v1300_segmentation}
    - {vol: minnie65_mip0_1024x1024x2048_x156000_y67000_z19000_volume, seg: minnie65_mip0_1024x1024x2048_x156000_y67000_z19000_v1300_segmentation}
    - {vol: minnie65_mip0_1024x1024x2048_x53000_y122000_z21000_volume, seg: minnie65_mip0_1024x1024x2048_x53000_y122000_z21000_v1300_segmentation}
    - {vol: minnie65_mip0_1024x1024x2048_x87000_y122000_z21500_volume, seg: minnie65_mip0_1024x1024x2048_x87000_y122000_z21500_v1300_segmentation}
    - {vol: minnie65_mip0_1024x1024x2048_x122000_y122000_z22500_volume, seg: minnie65_mip0_1024x1024x2048_x122000_y122000_z22500_v1300_segmentation}
    - {vol: minnie65_mip0_1024x1024x2048_x156000_y122000_z23500_volume, seg: minnie65_mip0_1024x1024x2048_x156000_y122000_z23500_v1300_segmentation}
    - {vol: minnie65_mip0_1024x1024x2048_x190000_y122000_z24500_volume, seg: minnie65_mip0_1024x1024x2048_x190000_y122000_z24500_v1300_segmentation}
  test_volumes:
    - {vol: minnie65_mip0_1024x1024x2048_x70000_y95000_z20000_volume, seg: minnie65_mip0_1024x1024x2048_x70000_y95000_z20000_v1300_segmentation}
    - {vol: minnie65_mip0_1024x1024x2048_x139000_y95000_z21000_volume, seg: minnie65_mip0_1024x1024x2048_x139000_y95000_z21000_v1300_segmentation}

model:
  type: vista3d
  in_channels: 1
  num_classes: 16
  emb_dim: 16
  feature_size: 48
  dropout: 0.2

optimizer:
  type: adamw
  lr: 1.0e-4
  weight_decay: 1.0e-5
  scheduler:
    type: cosine
    T_max: 100
    eta_min: 1.0e-6

loss:
  semantic_mode: sigmoid
  weight_semantic: 1.0
  weight_ce: 1.0
  weight_iou: 1.0
  weight_dice: 1.0
  weight_instance: 1.0
  weight_pull: 1.0
  weight_push: 1.0
  weight_norm: 0.001
  delta_v: 0.5
  delta_d: 1.5
  weight_edge: 10.0
  weight_bone: 1.0
  weight_geometry: 1.0
  dir_target: centroid
  weight_dir: 1.0
  weight_cov: 0.0
  weight_raw: 1.0
  loss_dir: smooth_l1
  loss_cov: mse
  loss_raw: l1
  ignore_index: -100

training:
  max_epochs: 100
  accelerator: auto
  devices: auto
  strategy: ddp
  precision: 16-mixed
  gradient_clip_val: 1.0
  limit_val_batches: 20
  log_every_n_steps: 50
  benchmark: true
  training_modes:
    - automatic
