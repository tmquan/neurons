# CREMI3D Configuration
# Neuron + synapse segmentation (4x4x40 nm)
#
# Train/val: samples A, B, C (with ground truth)
# Test:      samples A+, B+, C+ (padded, disjoint)

defaults:
  - default

experiment_name: cremi3d_instance_seg
project_name: neurons-cremi3d

data:
  dataset: cremi3d
  data_root: data/cremi3d
  batch_size: 4
  num_workers: 8
  cache_rate: 0.0
  slice_mode: false
  num_samples: 4000
  find_boundaries: 0.5
  patch_size: [32, 160, 160]
  train_volumes:
    - {vol: A}
    - {vol: B}
    - {vol: C}
  test_volumes:
    - {vol: A+}
    - {vol: B+}
    - {vol: C+}

model:
  type: vista3d
  in_channels: 1
  num_classes: 16
  emb_dim: 16
  feature_size: 48
  dropout: 0.2

optimizer:
  type: adamw
  lr: 1.0e-4
  weight_decay: 1.0e-5
  scheduler:
    type: cosine
    T_max: 200
    eta_min: 1.0e-7

loss:
  semantic_mode: sigmoid
  weight_semantic: 1.0
  weight_ce: 1.0
  weight_iou: 1.0
  weight_dice: 1.0
  weight_instance: 1.0
  weight_pull: 1.0
  weight_push: 1.0
  weight_norm: 0.001
  delta_v: 0.5
  delta_d: 1.5
  weight_edge: 10.0
  weight_bone: 1.0
  weight_geometry: 1.0
  dir_target: centroid
  weight_dir: 1.0
  weight_cov: 0.0
  weight_raw: 1.0
  loss_dir: smooth_l1
  loss_cov: mse
  loss_raw: l1
  ignore_index: -100

training:
  max_epochs: 200
  accelerator: auto
  devices: auto
  strategy: ddp
  precision: 16-mixed
  gradient_clip_val: 1.0
  limit_val_batches: 20
  log_every_n_steps: 50
  benchmark: true
  training_modes:
    - automatic
