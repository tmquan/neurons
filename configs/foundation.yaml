# Foundation Model Configuration
# Trains on ALL available datasets for a general-purpose connectomics model
# Uses the root key per volume to load from multiple data directories

defaults:
  - default

experiment_name: foundation_vista3d
project_name: neurons-foundation

data:
  dataset: snemi3d  # universal loader
  data_root: data/snemi3d
  batch_size: 4
  num_workers: 8
  cache_rate: 0.0
  slice_mode: false
  num_samples: 16000
  find_boundaries: 0.5
  patch_size: [32, 160, 160]

  train_volumes:
    # SNEMI3D (mouse somatosensory cortex, 6x6x30 nm)
    - {vol: AC4_inputs, seg: AC4_labels, root: data/snemi3d}
    # MICRONS (mouse visual cortex, 8x8x40 nm)
    - {vol: minnie65_mip0_crop_1024_train_volume, seg: minnie65_mip0_crop_1024_train_v1300_segmentation, root: /scratch/MICRONS}

  val_volumes:
    - {vol: AC4_inputs, seg: AC4_labels, root: data/snemi3d}

  test_volumes:
    - {vol: AC3_inputs, seg: AC3_labels, root: data/snemi3d}
    - {vol: minnie65_mip0_crop_1024_test_volume, seg: minnie65_mip0_crop_1024_test_v1300_segmentation, root: /scratch/MICRONS}

model:
  type: vista3d
  in_channels: 1
  num_classes: 16
  emb_dim: 16
  feature_size: 48
  dropout: 0.2

optimizer:
  type: adamw
  lr: 5.0e-5
  weight_decay: 1.0e-5
  scheduler:
    type: cosine
    T_max: 500
    eta_min: 1.0e-7

loss:
  semantic_mode: sigmoid
  weight_semantic: 1.0
  weight_ce: 1.0
  weight_iou: 1.0
  weight_dice: 1.0
  weight_instance: 1.0
  weight_pull: 1.0
  weight_push: 1.0
  weight_norm: 0.001
  delta_v: 0.5
  delta_d: 1.5
  weight_edge: 10.0
  weight_bone: 1.0
  weight_geometry: 1.0
  dir_target: centroid
  weight_dir: 1.0
  weight_cov: 0.0
  weight_raw: 1.0
  loss_dir: smooth_l1
  loss_cov: mse
  loss_raw: l1
  ignore_index: -100

training:
  max_epochs: 500
  accelerator: auto
  devices: auto
  strategy: ddp
  precision: 16-mixed
  gradient_clip_val: 1.0
  limit_val_batches: 20
  log_every_n_steps: 50
  benchmark: true
  training_modes:
    - automatic
    - proofread
  num_pos_points: 5
  num_neg_points: 5
  point_sample_mode: instance
