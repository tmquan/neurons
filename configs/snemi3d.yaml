# SNEMI3D Configuration
# Trains CosmosTransfer3D on the SNEMI3D neuron EM dataset.
#
# Usage:
#   python scripts/train.py --config-name snemi3d
#   python scripts/train.py --config-name snemi3d data.batch_size=8
#
# Full resume (optimizer + epoch) after interruption:
#   python scripts/train.py --config-name snemi3d \
#     training.resume_from_checkpoint=outputs/checkpoints/last.ckpt

defaults:
  - default

experiment_name: snemi3d
project_name: neurons
output_dir: outputs

data:
  dataset: snemi3d
  data_root: data/SNEMI3D
  batch_size: 4
  num_workers: 12
  persistent_workers: true
  cache_rate: 0.0
  pin_memory: true
  slice_mode: false
  num_samples: 16000
  patch_size: [80, 256, 256]
  find_boundaries: 1.0
  pixel_size: [30, 6, 6]   # z, y, x in nm — SNEMI3D resolution
  min_foreground: 0.80
  resolution_zoom_prob: 0.00
  resolution_zoom_range: [[30, 30], [6, 6], [6, 6]]
  # elastic_prob: 0.00
  # elastic_sigma_range: [5, 8]
  # elastic_magnitude_range: [50, 150]

  train_volumes:
    # AC4 (SNEMI3D train, 1024×1024×100, 401 instance IDs)
    # Download: python scripts/download_snemi3d.py --source snemi
    # Neurite11 full annotated cylinder (same 6×6×30 nm resolution)
    # Download: python scripts/download_snemi3d.py --source neurite11
    - vol: AC4_inputs
      seg: AC4_labels
      root: data/SNEMI3D
    - vol: neurite11_5000x2900x300_x3000_y7200_z950_volume
      seg: neurite11_5000x2900x300_x3000_y7200_z950_segmentation
      root: data/SNEMI3D
  val_volumes:
    - vol: AC4_inputs
      seg: AC4_labels
      root: data/SNEMI3D
    - vol: neurite11_5000x2900x300_x3000_y7200_z950_volume
      seg: neurite11_5000x2900x300_x3000_y7200_z950_segmentation
      root: data/SNEMI3D
  test_volumes:
    - vol: AC4_inputs
      seg: AC4_labels
      root: data/SNEMI3D
    - vol: neurite11_5000x2900x300_x3000_y7200_z950_volume
      seg: neurite11_5000x2900x300_x3000_y7200_z950_segmentation
      root: data/SNEMI3D

model:
  type: cosmostransfer3d
  in_channels: 1
  num_classes: 16
  emb_dim: 16
  feature_size: 64
  variant: "2B"
  dtype: "bf16"
  freeze_vae_encoder: true
  freeze_dit_backbone: false
  freeze_vae_decoder: false
  gradient_checkpointing: false
  dropout: 0.2

callbacks:
  cuda_empty_cache_before_val: true
  image_logger:
    max_images: 8

training:
  max_epochs: 100
  accelerator: auto
  devices: auto
  strategy: ddp
  precision: bf16-mixed
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  limit_val_batches: 100
  num_sanity_val_steps: 2
  log_every_n_steps: 50
  benchmark: true
  compile: false
  training_modes:
    - automatic
  # Validation-time clusterer.  `bandwidth` and `normalize_embeddings`
  # default to loss.delta_v / loss.normalize_embeddings.
  #
  # Options (fastest & most neuron-appropriate last):
  #   - soft_meanshift : differentiable, mode-based; over-segments
  #                      random embeddings early in training → pretty
  #                      but misleading panels before ~2 k steps.
  #   - hdbscan        : density-based, auto-K; honest but silent until
  #                      the embedding separates.  Ignores spatial
  #                      connectivity so two disconnected cells with
  #                      similar mean embedding can merge.
  #   - spatial_cc     : connected components on the per-voxel
  #                      embedding-affinity graph (6-connectivity).
  #                      Respects spatial connectivity, runs at full
  #                      resolution, one threshold (= delta_v), GPU via
  #                      cupyx.scipy.sparse.csgraph.  Recommended for
  #                      SNEMI3D-style dense EM — it cannot merge cells
  #                      that do not touch, which is the dominant
  #                      failure mode of HDBSCAN on this data.
  #
  # `backend: auto` picks the best available (cupy GPU → scipy CPU for
  # spatial_cc; cuML GPU → CPU for hdbscan).  Use `backend: <name>` to
  # force a specific path (useful for DDP reproducibility).
  clusterer:
    name: spatial_cc
    backend: auto
    min_cluster_size: 50
    connectivity: 1            # 1 → 6-neighbour; else → 26-neighbour
    # bandwidth: 0.5            # null → inherits loss.delta_v

optimizer:
  type: adamw
  lr: 2e-4
  dit_backbone_lr: 1e-5
  weight_decay: 1.0e-4
  scheduler:
    type: cosine_warmup
    warmup_epochs: 2
    T_max: 50
    eta_min: 1.0e-6

loss:
  semantic_mode: sigmoid
  active_classes: 1
  class_weights: [0.2]
  label_smoothing: 0.0
  weight_semantic: 1.0
  weight_ce: 1.0
  weight_iou: 0.0
  weight_dice: 1.0
  weight_instance: 1.0
  weight_pull: 1.0
  weight_push: 1.0
  weight_norm: 0.001
  delta_v: 0.5
  delta_d: 1.5
  normalize_embeddings: false
  anchor_to_centroid: false
  learned_task_weights: false
  max_hard_pairs: 0
  weight_edge: 1.0
  weight_bone: 1.0
  weight_geometry: 0.0
  dir_target: centroid
  weight_dir: 1.0
  weight_cov: 1.0
  weight_raw: 1.0
  loss_dir: smooth_l1
  loss_cov: smooth_l1
  loss_raw: smooth_l1
  ignore_index: -100
