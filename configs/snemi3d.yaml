# SNEMI3D Configuration
# Volumetric neuron segmentation (3D patches)

defaults:
  - default

experiment_name: snemi3d_instance_seg
project_name: neurons-snemi3d

data:
  dataset: snemi3d
  data_root: data/snemi3d
  batch_size: 4
  num_workers: 8
  train_val_split: 0.0
  cache_rate: 0.0  # must be 0 in 3D mode: virtual_len + cache freezes a single random crop
  slice_mode: false
  num_samples: 16000  # random 3D crops per epoch (volume has 100 Z-slices)
  patch_size:
    - 32
    - 128
    - 128
    

model:
  type: vista3d
  in_channels: 1
  num_classes: 16
  emb_dim: 16
  feature_size: 48
  dropout: 0.2

optimizer:
  type: adamw
  lr: 1.0e-4
  weight_decay: 1.0e-5
  scheduler:
    type: cosine
    T_max: 100
    eta_min: 1.0e-6

loss:
  semantic_mode: sigmoid     # sigmoid (multi-label: mito inside neuron) or softmax (mutually exclusive)
  weight_semantic: 1.0
  weight_ce: 1.0
  weight_iou: 1.0
  weight_dice: 1.0
  weight_instance: 1.0
  weight_pull: 1.0
  weight_push: 1.0
  weight_norm: 0.001
  delta_v: 0.5
  delta_d: 1.5
  weight_edge: 10.0
  weight_bone: 10.0
  weight_geometry: 1.0
  dir_target: skeleton         # skeleton (geometry-aware) or centroid
  weight_dir: 1.0
  weight_cov: 1.0
  weight_raw: 1.0
  loss_dir: smooth_l1          # smooth_l1 (robust offsets), mse, or l1
  loss_cov: mse                # mse (Frobenius-norm), l1, or smooth_l1
  loss_raw: l1                 # l1 (sharp reconstruction), mse, or smooth_l1
  ignore_index: -100

training:
  max_epochs: 100
  accelerator: auto  # Options: cpu, gpu, tpu, auto
  devices: auto
  strategy: ddp  # Explicit DDP for even GPU memory distribution
  precision: 32-true  # Options: 32-true, 16-mixed, bf16-mixed
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  val_check_interval: 1.0
  limit_val_batches: 100
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 2
  log_every_n_steps: 50
  enable_progress_bar: true
  enable_model_summary: true
  deterministic: false
  benchmark: true
  fast_dev_run: false
  training_modes:
    - automatic
  #   - proofread
  # num_pos_points: 5
  # num_neg_points: 5
  # point_sample_mode: "instance"  # Options: class, instance
  
