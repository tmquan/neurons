# Profiler Configuration
# Same as snemi3d but single GPU, 1 epoch, with Lightning profiler enabled

defaults:
  - default

experiment_name: snemi3d_profiler
project_name: neurons-snemi3d

data:
  dataset: snemi3d
  data_root: data/SNEMI3D
  batch_size: 2
  num_workers: 8
  cache_rate: 0.0
  slice_mode: false
  num_samples: 800
  find_boundaries: 0.5
  patch_size: [48, 256, 256]
  train_volumes:
    - {vol: AC4_inputs, seg: AC4_labels}
  test_volumes:
    - {vol: AC3_inputs, seg: AC3_labels}

model:
  type: vista3d
  in_channels: 1
  num_classes: 16
  emb_dim: 16
  feature_size: 48
  dropout: 0.2

optimizer:
  type: adamw
  lr: 1.0e-4
  weight_decay: 1.0e-5
  scheduler:
    type: cosine
    T_max: 100
    eta_min: 1.0e-6

loss:
  semantic_mode: sigmoid
  weight_semantic: 1.0
  weight_ce: 1.0
  weight_iou: 1.0
  weight_dice: 1.0
  weight_instance: 1.0
  weight_pull: 1.0
  weight_push: 1.0
  weight_norm: 0.001
  delta_v: 0.5
  delta_d: 1.5
  weight_edge: 10.0
  weight_bone: 1.0
  weight_geometry: 1.0
  dir_target: centroid
  weight_dir: 1.0
  weight_cov: 0.0
  weight_raw: 1.0
  loss_dir: smooth_l1
  loss_cov: mse
  loss_raw: l1
  ignore_index: -100

training:
  max_epochs: 1
  accelerator: gpu
  devices: 1
  strategy: auto
  precision: 16-mixed
  gradient_clip_val: 1.0
  num_sanity_val_steps: 0
  profiler: advanced
  training_modes:
    - automatic
